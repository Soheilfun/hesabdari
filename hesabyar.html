<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2783DE">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>حساب‌یار — نرم‌افزار حسابداری مغازه</title>
<style>
:root{
  --text:#2C2C2B; --text2:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7; --soft2:#F0EFED;
  --border:#E6E5E3; --blue:#2783DE; --blueSoft:#E5F2FC; --green:#46A171; --greenSoft:#E8F1EC;
  --orange:#D5803B; --orangeSoft:#FBEBDE; --red:#E56458; --redSoft:#FCE9E7;
  --radius:8px; --radiusL:12px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
  --nav:248px;
}
html[data-theme="dark"]{
  --text:#FFFFFF; --text2:rgba(255,255,255,.65); --canvas:#191919; --soft:#202020; --soft2:#383836;
  --border:rgba(255,255,255,.20); --blue:#5E9FE8; --blueSoft:rgba(94,159,232,.12);
  --green:#72BC8F; --greenSoft:rgba(114,188,143,.12); --orange:#DE9255; --orangeSoft:rgba(222,146,85,.12);
  --red:#E97366; --redSoft:rgba(233,115,102,.12);
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--soft); color:var(--text);
  font-family:"Segoe UI",Tahoma,system-ui,-apple-system,"Noto Sans Arabic",sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
h1,h2,h3{margin:0;font-weight:650;line-height:1.3}
h1{font-size:26px}
h2{font-size:22px}
h3{font-size:17px}
a{color:var(--blue)}
.hide{display:none !important}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.sidenav{
  width:var(--nav); flex:0 0 var(--nav); background:var(--canvas); border-inline-end:1px solid var(--border);
  padding:20px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.brand small{display:block;color:var(--text2);font-size:12px;font-weight:400}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:2px;
  background:none;border:0;border-radius:var(--radius);cursor:pointer;text-align:right;font-size:15px;min-height:44px;
}
.navbtn:hover{background:var(--soft2)}
.navbtn.active{background:var(--blueSoft);color:var(--blue);font-weight:600}
.navbtn .ic{font-size:17px;width:22px;text-align:center}
.navsep{height:1px;background:var(--border);margin:12px 8px}
.main{flex:1;min-width:0;padding:24px 32px 96px;max-width:1180px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.topbar .sub{color:var(--text2);font-size:14px;margin-top:4px}
.bottomnav{display:none}

@media (max-width:900px){
  .sidenav{display:none}
  .main{padding:16px 16px 92px;max-width:none}
  .bottomnav{
    display:flex;position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--canvas);
    border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottomnav button{
    flex:1;min-height:52px;background:none;border:0;border-radius:var(--radius);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--text2)
  }
  .bottomnav button .ic{font-size:19px}
  .bottomnav button.active{color:var(--blue);background:var(--blueSoft);font-weight:600}
}

/* ---------- pieces ---------- */
.card{background:var(--canvas);border:1px solid var(--border);border-radius:var(--radiusL);padding:20px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card h3{margin-bottom:14px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}

.kpi{background:var(--canvas);border:1px solid var(--border);border-radius:var(--radiusL);padding:16px}
.kpi .lbl{color:var(--text2);font-size:13px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:23px;font-weight:700;margin-top:8px;letter-spacing:-.2px;direction:rtl}
.kpi .hint{color:var(--text2);font-size:12px;margin-top:4px}
.kpi .val .u{font-size:14px;font-weight:600;color:var(--text2)}
@media (max-width:900px){.kpi .val{font-size:19px}}
.kpi.pos .val{color:var(--green)} .kpi.neg .val{color:var(--red)} .kpi.warn .val{color:var(--orange)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;
  border-radius:var(--radius);border:1px solid var(--border);background:var(--canvas);cursor:pointer;font-size:15px;
}
.btn:hover{background:var(--soft2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(.94)}
.btn.danger{color:var(--red);border-color:var(--border)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn:focus-visible,.navbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radiusL);background:var(--canvas)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th,td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--soft);font-weight:600;color:var(--text2);font-size:13px;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
td.num,th.num{font-variant-numeric:tabular-nums}
.empty{padding:40px 16px;text-align:center;color:var(--text2);font-size:14px}

.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
.tag.b{background:var(--blueSoft);color:var(--blue)}
.tag.g{background:var(--greenSoft);color:var(--green)}
.tag.o{background:var(--orangeSoft);color:var(--orange)}
.tag.r{background:var(--redSoft);color:var(--red)}
.tag.n{background:var(--soft2);color:var(--text2)}

label.f{display:block;margin-bottom:12px;font-size:13px;color:var(--text2)}
label.f > span{display:block;margin-bottom:5px}
input,select,textarea{
  width:100%;padding:10px 12px;min-height:44px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--canvas);color:var(--text)
}
textarea{min-height:74px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}

.banner{
  display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--radiusL);
  border:1px solid var(--border);background:var(--orangeSoft);margin-bottom:16px;font-size:14px
}
.banner .ic{font-size:20px}
.banner.blue{background:var(--blueSoft)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;border-radius:999px;background:var(--soft2);overflow:hidden}
.bar .fill{height:100%;border-radius:999px;background:var(--blue)}
.bar .fill.g{background:var(--green)} .bar .fill.r{background:var(--red)} .bar .fill.o{background:var(--orange)}
@media (max-width:640px){.bar{grid-template-columns:96px 1fr auto}}

.chart{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.chart .stack{width:100%;display:flex;gap:3px;align-items:flex-end;height:150px}
.chart .b1,.chart .b2{flex:1;border-radius:5px 5px 0 0;min-height:2px}
.chart .b1{background:var(--green)} .chart .b2{background:var(--red)}
.chart .cl{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text2);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal{background:var(--canvas);border-radius:var(--radiusL);border:1px solid var(--border);width:100%;max-width:720px;max-height:92vh;overflow:auto}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--canvas)}
.modal .mb{padding:20px}
.modal .mf{display:flex;gap:8px;justify-content:flex-start;padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--canvas)}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--text2);min-width:44px;min-height:44px;border-radius:var(--radius)}
.x:hover{background:var(--soft2)}

#toast{position:fixed;inset-inline:0;bottom:84px;display:flex;justify-content:center;pointer-events:none;z-index:80}
#toast div{background:var(--text);color:var(--canvas);padding:11px 18px;border-radius:999px;font-size:14px;box-shadow:var(--shadow)}

.itemrow{display:grid;grid-template-columns:1.7fr .6fr 1fr .8fr .9fr auto;gap:8px;align-items:center;margin-bottom:8px}
.itemrow.cost{grid-template-columns:1.5fr .6fr 1fr .8fr 1fr .9fr auto}
.itemrow .lbl{display:none}
@media (max-width:640px){
  .itemrow{grid-template-columns:1fr 1fr;padding:12px;border:1px solid var(--border);border-radius:var(--radius)}
  .itemrow .lbl{display:block;font-size:11px;color:var(--text2);margin-bottom:3px}
  .itemrow .wide{grid-column:1 / -1}
}
.muted{color:var(--text2)}
.small{font-size:13px}
.mono{font-variant-numeric:tabular-nums}
.right{text-align:left}
.totbox{background:var(--soft);border-radius:var(--radius);padding:14px;font-size:14px}
.totbox div{display:flex;justify-content:space-between;padding:4px 0}
.totbox .big{font-size:17px;font-weight:700;border-top:1px solid var(--border);margin-top:6px;padding-top:10px}

/* ---------- print ---------- */
#printarea{display:none}
.pv .ph{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:12px}
.pv .pc{margin-bottom:10px}
.pv table.pt{width:100%;border-collapse:collapse;margin-bottom:12px}
.pv table.pt th{background:#eee;border:1px solid #999;padding:6px;font-size:12px}
.pv table.pt td{border:1px solid #ccc;padding:6px;white-space:normal}
.pv .pf{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.pv .pnote{flex:1;font-size:12px}
.pv table.psum{border-collapse:collapse;min-width:260px}
.pv table.psum td{border-bottom:1px solid #ddd;padding:5px 8px;font-size:12px}
.pv table.psum tr.big td{font-size:15px;font-weight:700;border-top:2px solid #333}
.pv .num{text-align:left;font-variant-numeric:tabular-nums}
@media print{
  body{background:#fff}
  .shell,#toast,.overlay{display:none !important}
  #printarea{display:block !important;padding:0;color:#000;font-size:13px}
  #printarea table{min-width:0}
  #printarea th,#printarea td{border-bottom:1px solid #ccc}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidenav">
    <div class="brand">
      <div class="logo">حـ</div>
      <div><strong id="brandName">حساب‌یار</strong><small id="brandSub">حسابداری مغازه</small></div>
    </div>
    <div id="navList"></div>
    <div class="navsep"></div>
    <button class="navbtn" data-action="backup"><span class="ic">💾</span> پشتیبان‌گیری امروز</button>
    <button class="navbtn" data-action="theme"><span class="ic">🌗</span> حالت روشن / تاریک</button>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="bottomnav" id="bottomNav"></nav>
<div id="modalRoot"></div>
<div id="toast"></div>
<div id="printarea"></div>
<script>
/* ================= حساب‌یار | نرم‌افزار حسابداری مغازه — آفلاین ================= */
(function () {
'use strict';

/* ---------------- تقویم شمسی ---------------- */
var MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

function div(a, b) { return Math.floor(a / b); }
function g2j(gy, gm, gd) {
  var g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  var gy2 = (gm > 2) ? (gy + 1) : gy;
  var days = 355666 + (365 * gy) + div(gy2 + 3, 4) - div(gy2 + 99, 100) + div(gy2 + 399, 400) + gd + g_d_m[gm - 1];
  var jy = -1595 + (33 * div(days, 12053)); days %= 12053;
  jy += 4 * div(days, 1461); days %= 1461;
  if (days > 365) { jy += div(days - 1, 365); days = (days - 1) % 365; }
  var jm, jd;
  if (days < 186) { jm = 1 + div(days, 31); jd = 1 + (days % 31); }
  else { jm = 7 + div(days - 186, 30); jd = 1 + ((days - 186) % 30); }
  return [jy, jm, jd];
}
function j2g(jy, jm, jd) {
  var gy = (jy > 979) ? 1600 : 621;
  jy -= (jy > 979) ? 979 : 0;
  var days = (365 * jy) + (div(jy, 33) * 8) + div((jy % 33) + 3, 4) + 78 + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  gy += 400 * div(days, 146097); days %= 146097;
  if (days > 36524) { gy += 100 * div(--days, 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * div(days, 1461); days %= 1461;
  if (days > 365) { gy += div(days - 1, 365); days = (days - 1) % 365; }
  var gd = days + 1;
  var sal_a = [0,31,((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28,31,30,31,30,31,31,30,31,30,31];
  var gm = 0;
  for (gm = 1; gm <= 12 && gd > sal_a[gm]; gm++) gd -= sal_a[gm];
  return [gy, gm, gd];
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
/* ISO (میلادی متنی YYYY-MM-DD) <-> شمسی متنی YYYY/MM/DD */
function isoToJ(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  var j = g2j(+p[0], +p[1], +p[2]);
  return j[0] + '/' + pad(j[1]) + '/' + pad(j[2]);
}
function enDigits(s) {
  return String(s == null ? '' : s)
    .replace(/[\u06f0-\u06f9]/g, function (d) { return String(d.charCodeAt(0) - 0x06f0); })
    .replace(/[\u0660-\u0669]/g, function (d) { return String(d.charCodeAt(0) - 0x0660); });
}
function jToIso(js) {
  if (!js) return '';
  var p = enDigits(js).replace(/[^0-9]/g, '/').split('/').filter(function (x) { return x !== ''; });
  if (p.length < 3) return '';
  var jy = +p[0], jm = +p[1], jd = +p[2];
  if (jy < 1200) jy += 1300;
  if (jm < 1 || jm > 12 || jd < 1 || jd > 31) return '';
  var g = j2g(jy, jm, jd);
  return g[0] + '-' + pad(g[1]) + '-' + pad(g[2]);
}
function todayIso() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function jParts(iso) { var p = (iso || todayIso()).split('-'); return g2j(+p[0], +p[1], +p[2]); }
function jYear(iso) { return jParts(iso)[0]; }
function jMonth(iso) { return jParts(iso)[1]; }
function jLabel(iso) { var j = jParts(iso); return j[2] + ' ' + MONTHS[j[1] - 1] + ' ' + j[0]; }
function monthKey(iso) { var j = jParts(iso); return j[0] + '-' + pad(j[1]); }
function monthKeyLabel(key) { var p = key.split('-'); return MONTHS[+p[1] - 1] + ' ' + p[0]; }
function currentMonthKey() { return monthKey(todayIso()); }
function lastMonthKeys(n) {
  var j = jParts(todayIso()), y = j[0], m = j[1], out = [];
  for (var i = 0; i < n; i++) { out.unshift(y + '-' + pad(m)); m--; if (m === 0) { m = 12; y--; } }
  return out;
}

/* ---------------- ابزار ---------------- */
var FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function faNum(s) { return String(s).replace(/[0-9]/g, function (d) { return FA[+d]; }); }
function money(n) {
  n = Math.round(+n || 0);
  var neg = n < 0; n = Math.abs(n);
  var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '٬');
  return (neg ? '−' : '') + faNum(s);
}
function toman(n) { return money(n) + ' تومان'; }
function num(v) { var n = parseFloat(enDigits(v).replace(/[,٬\s]/g, '')); return isNaN(n) ? 0 : n; }
function uid(p) { return (p || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
function el(id) { return document.getElementById(id); }
function val(id) { var e = el(id); return e ? e.value.trim() : ''; }
function sum(arr, f) { return arr.reduce(function (a, x) { return a + (+f(x) || 0); }, 0); }
function toast(msg) {
  var t = el('toast'); t.innerHTML = '<div>' + esc(msg) + '</div>';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.innerHTML = ''; }, 2600);
}

/* ---------------- داده ---------------- */
var KEY = 'hesabyar.v1';
var EXPENSE_CATS = ['خرید کالا','اجاره مغازه','حقوق و دستمزد','آب و برق و گاز و تلفن','حمل و نقل','تبلیغات','مالیات و عوارض','بیمه','تجهیزات و تعمیرات','لوازم مصرفی مغازه','کارمزد بانکی','برداش�� شخصی','متفرقه'];
var INCOME_CATS = ['فروش کالا','خدمات و تعمیرات','تخفیف خرید از تأمین‌کننده','آورده نقدی مالک','سایر درآمد'];
var UNITS = ['عدد','بسته','متر','کیلوگرم','جفت','حلقه','لیتر'];
var CATS = ['ابزار برقی','ابزار دستی','یراق و قفل','پیچ و مهره','لوازم برقی و سیم','لوله و اتصالات','رنگ و چسب','ایمنی و حفاطت','مواد مصرفی'];
var METHODS = ['نقد','کارتخوان','کارت به کارت','انتقال بانکی','چک','اعتباری'];
var DOCTYPES = ['فاکتور رسمی خرید','فاکتور رسمی فروش','رسید بانکی','قرارداد','اژهارنامه مالیاتی','فیش پرداخت مالیات','بیمه','اجاره‌نامه','سایر'];

function blank() {
  return {
    settings: { shop: 'ابزارفروشی', owner: '', phone: '', address: '', taxRate: 10, theme: 'light', buyMarkup: 25, autoMargin: 20, addNewFromPurchase: true },
    accounts: [], contacts: [], products: [], invoices: [], txns: [], budgets: [], docs: [], cheques: [],
    meta: { lastBackup: '', created: todayIso(), snapshots: [] }
  };
}
var S = blank();

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var d = JSON.parse(raw), b = blank();
      Object.keys(b).forEach(function (k) { if (d[k] == null) d[k] = b[k]; });
      Object.keys(b.settings).forEach(function (k) { if (d.settings[k] == null) d.settings[k] = b.settings[k]; });
      S = d;
    } else { S = blank(); seed(); save(); }
  } catch (e) { S = blank(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('ذخیره در حافطه مرورگر انجام نشد — لطفاً خروجی پشتیبان بگیرید'); }
}
function seed() {
  S.accounts = [
    { id: uid('acc'), name: 'صندوق مغازه', type: 'صندوق نقدی', opening: 0, note: '', active: true },
    { id: uid('acc'), name: 'حساب بانکی مغازه', type: 'حساب بانکی', opening: 0, note: '', active: true },
    { id: uid('acc'), name: 'کارتخوان', type: 'کارتخوان (POS)', opening: 0, note: '', active: true }

/* ---------------- محاسبات ---------------- */
function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
function pName(id) { var p = byId(S.products, id); return p ? p.name : '—'; }
function cName(id) { var c = byId(S.contacts, id); return c ? c.name : '—'; }
function aName(id) { var a = byId(S.accounts, id); return a ? a.name : '—'; }

function invSubtotal(inv) { return sum(inv.items || [], function (it) { return Math.max(0, num(it.qty) * num(it.price) - num(it.discount)); }); }
function invTax(inv) { return Math.round((invSubtotal(inv) - num(inv.discount)) * num(inv.taxRate) / 100); }
function invTotal(inv) { return Math.max(0, invSubtotal(inv) - num(inv.discount) + invTax(inv)); }
function invPaid(inv) { return sum(S.txns.filter(function (t) { return t.invoiceId === inv.id; }), function (t) { return t.amount; }) + num(inv.openingPaid); }
function invBalance(inv) { return invTotal(inv) - invPaid(inv); }
function invCost(inv) {
  return sum(inv.items || [], function (it) {
    var p = byId(S.products, it.productId);
    var c = it.cost != null && it.cost !== '' ? num(it.cost) : (p ? num(p.buy) : 0);
    return c * num(it.qty);
  });
}
function invProfit(inv) { return invSubtotal(inv) - num(inv.discount) - invCost(inv); }
function invStatus(inv) {
  var b = invBalance(inv);
  if (b <= 0) return { t: 'تسویه شده', c: 'g' };
  if (invPaid(inv) > 0) return { t: 'بخشی پرداخت شده', c: 'o' };
  if (inv.due && inv.due < todayIso()) return { t: 'معوق', c: 'r' };
  return { t: 'پرداخت نشده', c: 'n' };
}
function accBalance(id) {
  var a = byId(S.accounts, id); if (!a) return 0;
  var b = num(a.opening);
  S.txns.forEach(function (t) {
    if (t.type === 'درآمد' && t.accountId === id) b += num(t.amount);
    if (t.type === 'هزینه' && t.accountId === id) b -= num(t.amount);
    if (t.type === 'انتقال') { if (t.accountId === id) b -= num(t.amount); if (t.toAccountId === id) b += num(t.amount); }
  });
  return b;
}
function cashTotal() { return sum(S.accounts, function (a) { return accBalance(a.id); }); }
function stockValue() { return sum(S.products, function (p) { return num(p.stock) * num(p.buy); }); }
function lowStock() { return S.products.filter(function (p) { return num(p.stock) <= num(p.min); }); }
function receivable() { return sum(S.invoices.filter(function (i) { return i.kind === 'فروش'; }), function (i) { return Math.max(0, invBalance(i)); }); }
function payable() { return sum(S.invoices.filter(function (i) { return i.kind === 'خرید'; }), function (i) { return Math.max(0, invBalance(i)); }); }
function monthTxns(key) { return S.txns.filter(function (t) { return monthKey(t.date) === key; }); }
function monthIncome(key) { return sum(monthTxns(key).filter(function (t) { return t.type === 'درآمد'; }), function (t) { return t.amount; }); }
function monthExpense(key) { return sum(monthTxns(key).filter(function (t) { return t.type === 'هزینه'; }), function (t) { return t.amount; }); }
function monthSalesProfit(key) {
  return sum(S.invoices.filter(function (i) { return i.kind === 'فروش' && monthKey(i.date) === key; }), function (i) { return invProfit(i); });
}

/* ---------------- موجودی کالا ---------------- */
function applyStock(inv, dir) {
  (inv.items || []).forEach(function (it) {
    var p = byId(S.products, it.productId); if (!p) return;
    var q = num(it.qty) * dir;
    p.stock = num(p.stock) + (inv.kind === 'فروش' || inv.kind === 'مرجوعی خرید' ? -q : q);
  });
}

function exportJson(silent) {

}
function downloadBlob(text, name, mime) {
  var blob = new Blob(['\ufeff' + text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function csv(rows) {
  return rows.map(function (r) {
    return r.map(function (c) { var s = String(c == null ? '' : c); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',');
  }).join('\r\n');
}

  (S.cheques || []).forEach(function (c) { parts.push([c.no, c.kind, c.bank, cName(c.contactId), isoToJ(c.due), c.amount, c.status]); });

/* ---------------- گزارش‌ها ---------------- */
function vReports() {
  var mk = F.repMonth;
  var sales = S.invoices.filter(function (i) { return i.kind === 'فروش' && monthKey(i.date) === mk; });
  var buys = S.invoices.filter(function (i) { return i.kind === 'خرید' && monthKey(i.date) === mk; });
  var salesTotal = sum(sales, function (i) { return invSubtotal(i) - num(i.discount); });
  var cogs = sum(sales, invCost);
  var expenses = sum(monthTxns(mk).filter(function (t) { return t.type === 'هزینه' && t.cat !== 'خرید کالا'; }), function (t) { return t.amount; });
  var net = salesTotal - cogs - expenses;

  var h = header('گزارش‌ها', 'سود و زیان، مالیات و پرفروش‌ترین کالاها',
    '<button class="btn" data-action="exportCsv">خروجی اکسل (CSV)</button><button class="btn primary" data-action="backup">پشتیبان کامل</button>');
  h += '<div class="card"><div class="row"><select data-filter="repMonth" style="max-width:200px">' + monthOptions(mk, '') + '</select>' +
    '<div class="spacer"></div><span class="muted small">' + faNum(sales.length) + ' فاکتور فروش • ' + faNum(buys.length) + ' فاکتور خرید</span></div></div>';
  h += '<div class="card"><h3>سود و زیان ' + monthKeyLabel(mk) + '</h3><div class="totbox">' +
    '<div><span>فروش خالص (بدون مالیات)</span><span class="mono">' + toman(salesTotal) + '</span></div>' +
    '<div><span>بهای تمام‌شده کالای فروشته‌شده</span><span class="mono">− ' + money(cogs) + '</span></div>' +
    '<div><span>سود ناویژه</span><span class="mono">' + toman(salesTotal - cogs) + '</span></div>' +
    '<div><span>سایر هزینه‌های مغازه</span><span class="mono">− ' + money(expenses) + '</span></div>' +
    '<div class="big"><span>سود (زیان) خالص</span><span class="mono" style="color:' + (net >= 0 ? 'var(--green)' : 'var(--red)') + '">' + toman(net) + '</span></div>' +
    '</div></div>';

  var prodStat = {};
  sales.forEach(function (i) {
    (i.items || []).forEach(function (it) {
      var k = it.productId || ('x' + (it.desc || ''));
      if (!prodStat[k]) prodStat[k] = { name: it.productId ? pName(it.productId) : (it.desc || 'متفرقه'), qty: 0, amount: 0, profit: 0 };
      var line = Math.max(0, num(it.qty) * num(it.price) - num(it.discount));
      var p = byId(S.products, it.productId);
      var cost = (it.cost != null && it.cost !== '' ? num(it.cost) : (p ? num(p.buy) : 0)) * num(it.qty);
      prodStat[k].qty += num(it.qty); prodStat[k].amount += line; prodStat[k].profit += line - cost;
    });
  });
  var top = Object.keys(prodStat).map(function (k) { return prodStat[k]; }).sort(function (a, b) { return b.amount - a.amount; }).slice(0, 8);
  var maxAmt = Math.max.apply(null, [1].concat(top.map(function (t) { return t.amount; })));
  h += '<div class="grid g2" style="margin-top:16px"><div class="card"><h3>پرفروش‌ترین کالاها</h3>' +
    (top.length ? '<div class="bars">' + top.map(function (t) {
      return '<div class="bar"><span>' + esc(t.name) + '</span><span class="track"><span class="fill" style="width:' + Math.round(t.amount / maxAmt * 100) + '%"></span></span>' +
        '<span class="mono small">' + money(t.amount) + '</span></div>';
    }).join('') + '</div>' : '<div class="muted small">در این ماه فروشی ثبت نشده است.</div>') + '</div>';

  var byCat = {};
  monthTxns(mk).filter(function (t) { return t.type === 'هزینه'; }).forEach(function (t) { byCat[t.cat || 'متفرقه'] = (byCat[t.cat || 'متفرقه'] || 0) + num(t.amount); });
  var catRows = Object.keys(byCat).map(function (k) { return { k: k, v: byCat[k] }; }).sort(function (a, b) { return b.v - a.v; });
  var maxCat = Math.max.apply(null, [1].concat(catRows.map(function (r) { return r.v; })));
  h += '<div class="card"><h3>هزینه‌ها به تفکیک دسته</h3>' +
    (catRows.length ? '<div class="bars">' + catRows.map(function (r) {
      return '<div class="bar"><span>' + esc(r.k) + '</span><span class="track"><span class="fill r" style="width:' + Math.round(r.v / maxCat * 100) + '%"></span></span>' +
        '<span class="mono small">' + money(r.v) + '</span></div>';
    }).join('') + '</div>' : '<div class="muted small">هزینه‌ای ثبت نشده است.</div>') + '</div></div>';

  h += '<div class="card" style="margin-top:16px"><h3>مالیات و مطالبات</h3><div class="grid g4">' +
    kpi('مالیات فروش این ماه', toman(sum(sales, invTax))) +
    kpi('مالیات خرید این ماه', toman(sum(buys, invTax))) +
    kpi('مطالبات جاری', toman(receivable()), receivable() ? 'warn' : '') +
    kpi('بدهی جاری', toman(payable()), payable() ? 'warn' : '') + '</div></div>';
  return h;
}

function rnd1000(v) { var r = Math.round(v / 1000) * 1000; return r > 0 ? r : Math.round(v); }

    '<div class="spacer"></div><button class="btn primary" data-action="bulkImport">بررسی و افزودن</button></div></div>';

function bulkUpsert(d, merge) {
  if (!d.name) return null;
  var ex = null;
  if (merge) for (var i = 0; i < S.products.length; i++) if (String(S.products[i].name).trim() === String(d.name).trim()) { ex = S.products[i]; break; }
  if (ex) {
    if (num(d.buy)) ex.buy = num(d.buy);
    if (num(d.sell)) ex.sell = num(d.sell);
    else if (num(d.buy) && num(ex.sell) < num(d.buy)) ex.sell = mgUp(d.buy);
    ex.stock = num(ex.stock) + num(d.qty);
    if (d.cat) ex.cat = d.cat;
    if (d.brand) ex.brand = d.brand;
    if (d.sku) ex.sku = d.sku;
    if (d.unit) ex.unit = d.unit;
    if (num(d.min)) ex.min = num(d.min);
    return 'up';
  }
  S.products.push({ id: uid('prd'), name: String(d.name).trim(), sku: d.sku || '', cat: d.cat || CATS[0],
    brand: d.brand || '', unit: d.unit || 'عدد', loc: '', buy: num(d.buy),
    sell: num(d.sell) ? num(d.sell) : mgUp(d.buy), stock: num(d.qty), min: num(d.min) || 1 });
  return 'new';
}
function bulkSaveRows() {
  var nw = 0, up = 0;
  for (var i = 0; i < BK; i++) {
    var nm = el('bkn' + i) ? el('bkn' + i).value.trim() : '';
    if (!nm) continue;
    var r = bulkUpsert({ name: nm, buy: val('bkb' + i), sell: val('bks' + i), qty: val('bkq' + i), cat: val('bkc' + i) }, true);
    if (r === 'new') nw++; else if (r === 'up') up++;
  }
  if (!nw && !up) return toast('حداقل نام یک کالا را وارد کنید');
  BK = 6; save(); render();
  toast(faNum(nw) + ' کالای جدید و ' + faNum(up) + ' کالای به‌روزشده ذخیره شد');
}
function bulkImport() {
  var txt = el('bkText') ? el('bkText').value : '';
  if (!txt.trim()) return toast('اول فایل را انتخاب کنید یا اطلاعات را بچسبانید');
  var merge = el('bkMerge') ? el('bkMerge').checked : true;
  var nw = 0, up = 0, bad = 0;
  txt.split(/\r?\n/).forEach(function (line) {
    if (!line.trim()) return;
    var c = line.split(/\t|;|,/).map(function (x) { return x.replace(/^"|"$/g, '').trim(); });
    if (!c[0]) return;
    if (/نام کالا|name/i.test(c[0])) return;
    if (c.length < 2 && !num(c[1])) { bad++; }
    var r = bulkUpsert({ name: c[0], buy: c[1], sell: c[2], qty: c[3], cat: c[4], brand: c[5], sku: c[6], unit: c[7], min: c[8] }, merge);
    if (r === 'new') nw++; else if (r === 'up') up++;
  });
  if (!nw && !up) return toast('چیزی برای افزودن پیدا نشد — ترتیب ستون‌ها را چک کنید');
  save(); VIEW = 'products'; render();
  toast(faNum(nw) + ' کالای جدید اضافه و ' + faNum(up) + ' کالا به‌روز شد');
}

function drawTotals() {

  var sub = invSubtotal(t), tax = Math.round((sub - t.discount) * t.taxRate / 100);

function syncItems() {
  var box = el('itemsBox'); if (!box) return;
  Array.prototype.forEach.call(box.querySelectorAll('[data-item]'), function (inp) {
    var i = +inp.getAttribute('data-i'), k = inp.getAttribute('data-item');
    if (!D.items[i]) return;
    D.items[i][k] = (k === 'productId' || k === 'desc') ? inp.value : (inp.value === '' ? '' : num(inp.value));
  });
}
function saveInvoice() {
  syncItems();
  var items = D.items.filter(function (it) { return (it.productId || it.desc) && num(it.qty) > 0; });
  if (!items.length) return toast('حداقل یک قلم با تعداد وارد کنید');
  var old = D.id ? byId(S.invoices, D.id) : null;
  if (old) applyStock(old, -1);
  var o = old || { id: uid('inv') };
  o.kind = val('iKind'); o.no = val('iNo') || nextNo(o.kind); o.date = readDate('iDate');
  o.due = jToIso(val('iDue')) || ''; o.contactId = val('iContact') || null;
  o.discount = num(val('iDiscount')); o.taxRate = num(val('iTax')); o.note = val('iNote');
  o.items = items; o.openingPaid = num(o.openingPaid);
  var added = 0;
  if (o.kind === 'خرید') {
    var addNew = el('iAddNew') ? el('iAddNew').checked : true;
    var mk = num(val('iMarkup')) || 25;
    items.forEach(function (it) {
      var pr = num(it.price);
      if (it.productId) {
        var ep = byId(S.products, it.productId);
        if (ep && pr > 0) { ep.buy = pr; if (num(ep.sell) < pr) ep.sell = rnd1000(pr * (1 + mk / 100)); }
        return;
      }
      if (!addNew || !it.desc) return;
      var np2 = { id: uid('prd'), name: String(it.desc).trim(), sku: '', cat: CATS[0], brand: '', unit: 'عدد',
        loc: '', buy: pr, sell: rnd1000(pr * (1 + mk / 100)), stock: 0, min: 1 };
      S.products.push(np2); it.productId = np2.id; added++;
    });
    S.settings.buyMarkup = mk;
    if (el('iAddNew')) S.settings.addNewFromPurchase = el('iAddNew').checked;
  }
  if (!old) S.invoices.push(o);
  applyStock(o, 1);
  save(); closeModal(); render();
  toast('فاکتور ' + o.no + ' ذخیره شد و موجودی به‌روز شد' + (added ? ' — ' + faNum(added) + ' کالای جدید هم به لیست کالاها افزوده شد' : ''));
}

  var cat = val('bpCat'), br = val('bpBrand'), rd = el('bpRound') ? el('bpRound').checked : true;
  var f = 1 + pct / 100, n = 0;
  S.products.forEach(function (p) {

    n++;
  });

  toast('قیمت ' + faNum(n) + ' کالا با ' + faNum(pct) + '٪ تغییر کرد');

  modal('تأیید', '<p>' + msg + '</p>', '<button class="btn" data-action="closeModal">انصراف</button><button class="btn danger" data-action="' + action + '">بله، حذف کن</button>');
}
var PENDING = null;

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-action]'); if (!b) return;
  var a = b.getAttribute('data-action'), id = b.getAttribute('data-id');
  if (a === 'maybeClose') { if (e.target === b) closeModal(); return; }
  switch (a) {
    case 'go': VIEW = b.getAttribute('data-k'); closeModal(); render(); break;
    case 'more': moreMenu(); break;
    case 'closeModal': closeModal(); break;
    case 'theme': S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark'; save(); render(); break;
    case 'backup': exportJson(); break;
    case 'exportCsv': exportAllCsv(); break;
    case 'setToday': el(b.getAttribute('data-t')).value = isoToJ(todayIso()); break;

    case 'newProduct': formProduct(null); break;
    case 'priceBump': formPriceBump(); break;
    case 'savePriceBump': savePriceBump(); break;
    case 'bulkSample': bulkSample(); break;
    case 'bulkImport': bulkImport(); break;
    case 'bulkSaveRows': bulkSaveRows(); break;
    case 'bulkMoreRows': el('bkRows').insertAdjacentHTML('beforeend', bulkRowsHtml(5, BK)); BK += 5; break;

    case 'newCheque': formCheque(null); break;
    case 'editCheque': formCheque(byId(S.cheques, id)); break;
    case 'chequePass': formChequePass(byId(S.cheques, id)); break;
    case 'saveCheque': saveCheque(); break;
    case 'saveChequePass': saveChequePass(); break;
    case 'chequeBounce': var cb = byId(S.cheques, id); if (cb) { cb.status = 'برگشتی'; save(); render(); toast('چک برگشتی شد'); } break;
    case 'delCheque': PENDING = { t: 'cheques', id: id }; confirmBox('این چک حذف شود؟', 'doDelete'); break;
    case 'editProduct': formProduct(byId(S.products, id)); break;
    case 'adjustStock': formStock(byId(S.products, id)); break;
    case 'delProduct': PENDING = { t: 'products', id: id }; confirmBox('این کالا حذف شود؟ اقلام فاکتورهای قبلی با شرح دستی باقی می‌مانند.', 'doDelete'); break;

    case 'newAccount': formAccount(null); break;
    case 'editAccount': formAccount(byId(S.accounts, id)); break;
    case 'delAccount': PENDING = { t: 'accounts', id: id }; confirmBox('این حساب حذف شود؟', 'doDelete'); break;

    case 'newContact': formContact(null); break;
    case 'editContact': formContact(byId(S.contacts, id)); break;
    case 'delContact': PENDING = { t: 'contacts', id: id }; confirmBox('این طرف‌حساب حذف شود؟', 'doDelete'); break;
    case 'quickContact': var kn = prompt('نام طرف‌حساب جدید:'); if (kn) {
        var nc = { id: uid('cnt'), name: kn, role: (val('iKind') || '').indexOf('فروش') > -1 ? 'مشتری' : 'تأمین‌کننده' };
        S.contacts.push(nc); save();
        el('iContact').innerHTML = opts(S.contacts, nc.id, '— انتخاب کنید —'); toast('طرف‌حساب افزوده ��د');
      } break;

    case 'newTxn': formTxn(null); break;
    case 'editTxn': formTxn(byId(S.txns, id)); break;
    case 'delTxn': PENDING = { t: 'txns', id: id }; confirmBox('این تراکنش حذف شود؟', 'doDelete'); break;
    case 'newTransfer': formTransfer(); break;

    case 'newBudget': formBudget(null); break;
    case 'editBudget': formBudget(byId(S.budgets, id)); break;
    case 'delBudget': PENDING = { t: 'budgets', id: id }; confirmBox('این بودجه حذف شود؟', 'doDelete'); break;

    case 'newDoc': formDoc(null); break;
    case 'editDoc': formDoc(byId(S.docs, id)); break;
    case 'delDoc': PENDING = { t: 'docs', id: id }; confirmBox('این سند حذف شود؟', 'doDelete'); break;

    case 'newInvoice': formInvoice(null, b.getAttribute('data-kind')); break;
    case 'editInvoice': formInvoice(byId(S.invoices, id)); break;
    case 'printInvoice': printInvoice(byId(S.invoices, id)); break;
    case 'pay': formPay(byId(S.invoices, id)); break;
    case 'delInvoice': PENDING = { t: 'invoices', id: id }; confirmBox('این فاکتور حذف شود؟ موجودی کالاها برگردانده می‌شود و پرداخت‌های مربوط هم حذف می‌شوند.', 'doDelete'); break;

    case 'itemAdd': syncItems(); D.items.push({ productId: '', desc: '', qty: 1, price: 0, discount: 0 }); drawItems(); break;
    case 'itemDel': syncItems(); D.items.splice(+b.getAttribute('data-i'), 1); if (!D.items.length) D.items.push({ productId: '', desc: '', qty: 1, price: 0, discount: 0 }); drawItems(); break;

    case 'saveProduct': saveProduct(); break;
    case 'saveStock': saveStock(); break;
    case 'saveAccount': saveAccount(); break;
    case 'saveContact': saveContact(); break;
    case 'saveTxn': saveTxn(); break;
    case 'saveTransfer': saveTransfer(); break;
    case 'saveBudget': saveBudget(); break;
    case 'saveDoc': saveDoc(); break;
    case 'saveInvoice': saveInvoice(); break;
    case 'savePay': savePay(); break;
    case 'saveSettings':
      S.settings.shop = val('stShop'); S.settings.owner = val('stOwner'); S.settings.phone = val('stPhone');
      S.settings.address = val('stAddr'); S.settings.taxRate = num(val('stTax'));
      if (el('stMargin')) S.settings.autoMargin = num(val('stMargin')) || 20;
      if (el('stBuyMk')) S.settings.buyMarkup = num(val('stBuyMk')) || 25;
      save(); render(); toast('تنزیمات ذخیره شد'); break;

    case 'doDelete':
      if (PENDING) {
        if (PENDING.t === 'invoices') {
          var inv = byId(S.invoices, PENDING.id);
          if (inv) { applyStock(inv, -1); S.txns = S.txns.filter(function (t) { return t.invoiceId !== inv.id; }); }
        }
        S[PENDING.t] = S[PENDING.t].filter(function (x) { return x.id !== PENDING.id; });
        PENDING = null; save(); closeModal(); render(); toast('حذف شد');
      }
      break;

    case 'restore':
      modal('بازگردانی از فایل پشتیبان',
        '<p class="small">فایل <span class="mono">.json</span> پشتیبان را انتخاب کنید. توجه: اطلاعات فعلی جایگزین می‌شود.</p>' +
        '<label class="f"><span>فایل پشتیبان</span><input type="file" id="impFile" accept=".json,application/json"></label>',
        '<button class="btn" data-action="closeModal">انصراف</button><button class="btn primary" data-action="doRestore">بازگردانی</button>');
      break;
    case 'doRestore':
      var f = el('impFile'); if (f && f.files && f.files[0]) importJson(f.files[0]); else toast('اول فایل را انتخاب کنید');
      break;
    case 'reset': confirmBox('همه اطلاعات برنامه پاک شود؟ اگر پشتیبان نگرفته‌اید، اول پشتیبان بگیرید.', 'doReset'); break;
    case 'doReset': S = blank(); seed(); save(); closeModal(); VIEW = 'dash'; render(); toast('برنامه خالی شد'); break;
  }
});

document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.hasAttribute && t.hasAttribute('data-filter')) {
    F[t.getAttribute('data-filter')] = t.value;
    if (t.tagName === 'INPUT') { clearTimeout(window.__ft); window.__ft = setTimeout(render, 250); } else render();
    return;
  }
  if (t.hasAttribute && (t.hasAttribute('data-item') || t.id === 'iDiscount' || t.id === 'iTax')) { syncItems(); drawTotals(); }
  if (t.hasAttribute && t.hasAttribute('data-mg')) {
    t.removeAttribute('data-auto');
    var o = el(t.getAttribute('data-other'));
    if (o && num(t.value) && (o.value === '' || o.getAttribute('data-auto') === '1')) {
      var pct = mgPct(), v = num(t.value);
      o.value = rnd1000(t.getAttribute('data-mg') === 'buy' ? v * (1 + pct / 100) : v * (1 - pct / 100));
      o.setAttribute('data-auto', '1');
    }
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'bkFile' && t.files && t.files[0]) {
    var rd = new FileReader();
    rd.onload = function () { if (el('bkText')) { el('bkText').value = String(rd.result || ''); toast('فایل خوانده شد — دکمه «بررسی و افزودن» را بزنید'); } };
    rd.readAsText(t.files[0]);
    return;
  }
  if (t.hasAttribute && t.hasAttribute('data-item')) {
    var i = +t.getAttribute('data-i');
    if (t.getAttribute('data-item') === 'productId' && t.value) {
      var p = byId(S.products, t.value);
      syncItems();
      var isSale = (val('iKind') || D.kind).indexOf('فروش') > -1;
      if (p && !num(D.items[i].price)) D.items[i].price = isSale ? num(p.sell) : num(p.buy);
      drawItems();
    }
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key !== 'Enter' || e.ctrlKey || e.altKey || e.metaKey) return;
  var t = e.target; if (!t || !t.tagName) return;
  var tag = t.tagName.toLowerCase();
  if (tag !== 'input' && tag !== 'select') return;
  if (t.type === 'file' || t.type === 'checkbox' || t.type === 'radio') return;
  e.preventDefault();
  var scope = t.closest('.modal') || t.closest('#main') || document;
  var fs = Array.prototype.filter.call(scope.querySelectorAll('input,select,textarea'), function (x) {
    return !x.disabled && x.type !== 'hidden' && x.offsetParent !== null;
  });
  var i = fs.indexOf(t);
  if (i > -1 && i + 1 < fs.length) { fs[i + 1].focus(); if (fs[i + 1].select) try { fs[i + 1].select(); } catch (er) {} return; }
  var ov = t.closest('.overlay');
  var sv = ov ? ov.querySelector('.mf .primary') : null;
  if (sv) sv.focus();
});

/* ================== شروع ================== */
load();
render();
window.hesab = { state: function () { return S; }, backup: exportJson };
})();

</script>
