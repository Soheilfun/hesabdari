<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="description" content="حساب‌یار — نرم‌افزار حسابداری مغازه ابزارفروشی" />
<title>حساب‌یار</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232783DE'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif'%3E%D8%AD%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/assets/app.css" />
<script>
  // تم قبل از رندر اعمال می‌شود تا پرش رنگ رخ ندهد
  try {
    var t = localStorage.getItem('hesabyar.theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<!-- صفحه ورود -->
<main id="gate" class="gate is-hidden">
  <form class="gate-card" id="gate-form">
    <div class="mark" aria-hidden="true">ح</div>
    <h1 style="font-size:1.3rem">حساب‌یار</h1>
    <p>برای دیدن اطلاعات مغازه، رمز عبور را وارد کنید.</p>
    <p class="small muted">نسخه ۱.۸ بتا</p>
    <div class="field">
      <label class="lbl" for="gate-pass">رمز عبور</label>
      <input id="gate-pass" name="password" type="password" autocomplete="current-password" placeholder="••••••••" />
    </div>
    <div class="gate-error" id="gate-error" role="alert"></div>
    <button class="btn btn-primary btn-block" type="submit" id="gate-submit">ورود</button>
    <p class="tiny muted" style="margin-top:16px">اطلاعات روی سرور ذخیره می‌شود و روی همه دستگاه‌ها یکسان است.</p>
  </form>
</main>

<!-- پوسته برنامه -->
<div id="app" class="app is-hidden">
  <aside class="rail" id="rail">
    <div class="rail-brand">
      <div class="mark" aria-hidden="true">ح</div>
      <div class="meta">
        <div class="name" id="brand-name">حساب‌یار</div>
        <div class="sub" id="brand-sub">حسابداری مغازه</div>
        <div class="ver" id="brand-ver" title="همگام‌سازی خودکار فعال است">نسخه ۱.۸ بتا</div>
      </div>
    </div>
    <nav id="nav" aria-label="منوی اصلی"></nav>
  </aside>

  <div class="content">
    <header class="topbar">
      <div class="search">
        <span class="ico" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span>
        <input id="global-search" type="search" placeholder="جستوجوی کالا، فاکتور یا طرف حساب…" aria-label="جستوجو" />
      </div>
      <div class="push cluster">
        <button type="button" class="sync" id="sync-chip" data-state="ok" title="همگام‌سازی دوباره">
          <span class="dot" aria-hidden="true"></span><span id="sync-text">همگام</span>
        </button>
        <button type="button" class="btn btn-ghost btn-icon" id="theme-btn" aria-label="تغییر تم"><svg class="i" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17Z" fill="currentColor" stroke="none"/></svg></button>
        <button type="button" class="btn btn-ghost btn-icon" id="lock-btn" aria-label="خروج"><svg class="i" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3v8"/><path d="M7.2 6.4a7.5 7.5 0 1 0 9.6 0"/></svg></button>
      </div>
    </header>

    <main id="page" class="page" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="منوی موبایل"></nav>
</div>

<div id="print-area" aria-hidden="true"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
